name: Update Spamhaus DROP lists

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python update.py
      - name: Commit changed lists
        run: |
          if git diff --quiet -- drop_v4.txt drop_v6.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drop_v4.txt drop_v6.txt
          git commit -m "Update Spamhaus DROP lists"
          git push
